<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanta</title>
    <style>
      :root {
        background: #05070d;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 24% 18%, rgba(0, 194, 255, 0.2), transparent 30%),
          radial-gradient(circle at 78% 12%, rgba(139, 91, 255, 0.22), transparent 32%),
          linear-gradient(135deg, #03050a 0%, #07111e 46%, #0b0d15 100%);
      }

      #root {
        min-height: 100vh;
      }

      #vanta-splash {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #edf5ff;
        background:
          radial-gradient(circle at 24% 18%, rgba(0, 194, 255, 0.2), transparent 30%),
          radial-gradient(circle at 78% 12%, rgba(139, 91, 255, 0.22), transparent 32%),
          linear-gradient(135deg, #03050a 0%, #07111e 46%, #0b0d15 100%);
        transition: opacity 360ms ease, visibility 360ms ease;
        -webkit-app-region: drag;
      }

      #vanta-splash::before {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.034) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: radial-gradient(circle at 50% 35%, black, transparent 72%);
        content: "";
      }

      #vanta-splash::after {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: conic-gradient(from 180deg, #65e6ff, #8f62ff, #ffd36b, #65e6ff);
        filter: blur(74px);
        opacity: 0.2;
        animation: vanta-orbit 4.2s linear infinite;
        content: "";
      }

      .splash-card {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 18px;
        -webkit-app-region: drag;
      }

      .splash-logo {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border: 1px solid rgba(194, 222, 255, 0.2);
        border-radius: 24px;
        color: #061019;
        font: 800 36px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        background: linear-gradient(135deg, #8ef3ff, #9b8cff);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.36), 0 0 46px rgba(101, 230, 255, 0.18);
        animation: vanta-pulse 1.8s ease-in-out infinite;
      }

      .splash-title {
        margin: 0;
        color: #f4fbff;
        font: 800 22px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0;
      }

      .splash-bar {
        width: 168px;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .splash-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #65e6ff, #8f62ff, #ffd36b);
        animation: vanta-load 1.25s ease-in-out infinite;
      }

      body.app-ready #vanta-splash {
        visibility: hidden;
        opacity: 0;
      }

      @keyframes vanta-load {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @keyframes vanta-pulse {
        0%, 100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-2px) scale(1.035);
        }
      }

      @keyframes vanta-orbit {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <div id="vanta-splash" aria-label="Loading Vanta" data-tauri-drag-region>
      <div class="splash-card" data-tauri-drag-region>
        <div class="splash-logo" data-tauri-drag-region>V</div>
        <p class="splash-title" data-tauri-drag-region>Vanta</p>
        <div class="splash-bar" data-tauri-drag-region><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
