name: Build Vanta

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact_name: vanta-windows-x64
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
            release_path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            artifact_name: vanta-linux-x64
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
            release_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-arm64
            os: macos-14
            artifact_name: vanta-macos-arm64
            artifact_path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
            release_path: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm \
            webkit2gtk-4.1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Package Windows portable zip
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/vanta.exe -DestinationPath src-tauri/target/release/bundle/Vanta_1.0.0_windows-x64-portable.zip -Force

      - name: Package macOS app zip
        if: matrix.name == 'macos-arm64'
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Vanta.app ../../Vanta_1.0.0_macos-arm64-app.zip

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload Windows portable zip
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: vanta-windows-x64-portable
          path: src-tauri/target/release/bundle/*portable.zip
          if-no-files-found: error

      - name: Upload macOS app zip
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: vanta-macos-arm64-app
          path: src-tauri/target/release/bundle/*macos-arm64-app.zip
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_path }}

      - name: Publish Windows portable zip
        if: startsWith(github.ref, 'refs/tags/') && matrix.name == 'windows-x64'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/*portable.zip

      - name: Publish macOS app zip
        if: startsWith(github.ref, 'refs/tags/') && matrix.name == 'macos-arm64'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/*macos-arm64-app.zip
